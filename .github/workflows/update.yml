name: 更新三大法人資料

on:
  schedule:
    - cron: "30 10 * * *"   # UTC 10:30 ＝ 台北時間每天 18:30
  workflow_dispatch:          # 也可以在 Actions 頁面手動執行

permissions:
  contents: write   # commit 新資料
  pages: write      # 發佈 GitHub Pages
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取資料並計算連續天數
        run: python scripts/update.py

      - name: Commit 新資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
